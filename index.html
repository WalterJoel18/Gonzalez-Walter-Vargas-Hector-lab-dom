<!doctype html>
<html lang="es">

<head>
    <link rel="stylesheet" href="estilos.css" />
    <meta charset="UTF-8" />
    <title>Lab DOM</title>
</head>

<body>
    <header class="encabezado">
        <h1>Inscripción al Curso</h1>
        <p>Facultad de Ingeniería de Sistemas Computacionales · UTP</p>
    </header>
    
    <form id="inscripcion" novalidate>
        
        <!-- Nombre completo -->
        <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" placeholder="Juanito Alimaña" autocomplete="name"
                aria-describedby="nombre-error" />
            <p id="nombre-error" class="error" aria-live="polite"></p>
        </div>
        <!-- Fecha de nacimiento -->
        <div class="campo">
            <label for="nacimiento">Fecha de nacimiento</label>
            <input type="date" id="nacimiento" name="nacimiento" aria-describedby="nacimiento-error" />
            <p id="nacimiento-error" class="error" aria-live="polite"></p>
        </div>

        <!-- Curso -->
        <div class="campo">
            <label for="curso">Curso</label>
            <select id="curso" name="curso" aria-describedby="curso-error">
                <option value="">Selecciona un curso</option>
                <option value="ingenieria-web">Ingeniería Web</option>
                <option value="redes">Redes de Computadoras</option>
                <option value="sistemas-operativos">Sistemas Operativos</option>
                <option value="bases-datos">Bases de Datos</option>
            </select>
            <p id="curso-error" class="error" aria-live="polite"></p>
        </div>
        <!-- Cédula -->
        <div class="campo">
            <label for="cedula">Cédula</label>
            <input id="cedula" name="cedula" placeholder="8-123-4567" aria-describedby="cedula-error" />
            <p id="cedula-error" class="error" aria-live="polite"></p>
        </div>

        <!-- Correo -->
        <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" autocomplete="email" placeholder="nombre@dominio.com"
                aria-describedby="correo-error" />
            <p id="correo-error" class="error" aria-live="polite"></p>
        </div>

        <!-- Celular -->
        <div class="campo">
            <label for="celular">Celular</label>
            <input type="tel" id="celular" name="celular" autocomplete="tel" placeholder="6123-4567"
                aria-describedby="celular-error" />
            <p id="celular-error" class="error" aria-live="polite"></p>
        </div>
        <fieldset>
            <legend>Modalidad</legend>
            <label><input type="radio" name="modalidad" value="presencial" />
                Presencial</label>
            <label><input type="radio" name="modalidad" value="virtual" />
                Virtual</label>
        </fieldset>
        <div class="campo" id="campo-sede" hidden>
            <label for="sede">Sede</label>
            <select id="sede" name="sede" aria-describedby="sede-error">
                <option value="">Selecciona una sede</option>
                <option>Ciudad de Panamá</option>
                <option>David</option>
                <option>Santiago</option>
            </select>
            <p id="sede-error" class="error" aria-live="polite"></p>
        </div>
        <!-- …resto de campos… -->
        <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" aria-describedby="clave-error meter-lbl" />
            <div class="meter" aria-hidden="true"><i id="meter-bar"></i></div>
            <span class="meter-lbl" id="meter-lbl">Fuerza: —</span>
            <p id="clave-error" class="error" aria-live="polite"></p>
        </div>

        <!-- Confirmar contraseña -->
        <div class="campo">
            <label for="clave2">Confirmar contraseña</label>
            <input type="password" id="clave2" name="clave2" aria-describedby="clave2-error" />
            <p id="clave2-error" class="error" aria-live="polite"></p>
        </div>

        <!-- Comentarios -->
        <div class="campo">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label for="comentarios">Comentarios</label>
                <span id="contador-comentarios" class="contador">0/200</span>
            </div>
            <textarea id="comentarios" name="comentarios" rows="3" maxlength="200"
                aria-describedby="comentarios-error"></textarea>
            <p id="comentarios-error" class="error" aria-live="polite"></p>
        </div>

        <!-- Términos -->
        <div class="campo campo-check">
            <label>
                <input type="checkbox" id="terminos" name="terminos" aria-describedby="terminos-error" />
                Acepto los términos y condiciones
            </label>
            <p id="terminos-error" class="error" aria-live="polite"></p>
        </div>

        <button type="submit">Inscribirme</button>
    </form>
    <section id="confirmacion" aria-live="polite"></section>
    <script src="validacion.js" defer></script>
</body>

</html>
